name: Build iOS IPA (C++ core)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/ios-core.yml"]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Xcode project)
        run: cmake -S core -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DSABAK_SDL=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
      - name: Build unsigned
        run: |
          set -eo pipefail
          cmake --build build-ios --config Release --target SabakGame -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -40
          find build-ios -name "SabakGame.app" -maxdepth 4
      - name: Package IPA
        run: |
          set -e
          APP=$(find build-ios -name "SabakGame.app" -path "*Release-iphoneos*" | head -1)
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry SabakCore.ipa Payload) && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: SabakCore-ipa, path: out/SabakCore.ipa }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete core-latest -y --cleanup-tag || true
          gh release create core-latest out/SabakCore.ipa -t "Sabak Core (C++) build" -n "Unsigned IPA from the C++ core (sign with Sideloadly/AltStore)." --target "$GITHUB_SHA"
