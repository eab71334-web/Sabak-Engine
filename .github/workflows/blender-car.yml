name: Blender car
on:
  workflow_dispatch:
  push:
    paths: ['tools/blender/**', '.github/workflows/blender-car.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo snap install blender --classic
      - name: Build car
        run: blender -b -P tools/blender/car_g82.py -- out 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        with:
          name: car
          path: out/*
      - name: Commit results
        run: |
          mkdir -p assets/generated && cp out/car.glb out/*.png assets/generated/
          git config user.name "blender-ci" && git config user.email "ci@users.noreply.github.com"
          git add assets/generated && git commit -m "CI: car render + glb" && git pull --rebase && git push || true
